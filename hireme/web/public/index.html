<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hireme</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Hireme.sk</h1>
    <p class="subtitle">We highlight impactful opportunities that are relevant for seekers from Slovakia, or anywhere in the world. You can see the data in <a href="https://airtable.com/appgt87HxTF26Orqm/shrdINsIjsRZGo7Im">airtable</a> as well.</p>

    <div class="controls">
      <input id="search" type="search" placeholder="Search title, org, tags…" autofocus />
      <select id="sort">
        <option value="posted_desc">Newest first</option>
        <option value="posted_asc">Oldest first</option>
        <option value="closing_soon">Closing soon</option>
        <option value="org">Organization A–Z</option>
      </select>
      <select id="view">
        <option value="all">All jobs</option>
        <option value="liked">Liked</option>
        <option value="hidden">Not relevant</option>
      </select>
    </div>

    <div id="sourceFilters" class="chip-row"></div>
    <div id="activeTags" class="chip-row"></div>
    <p id="count" class="count"></p>
  </header>

  <main id="jobs"></main>

  <p id="empty" class="empty" hidden>No jobs match your filters.</p>

  <script src="/app.js"></script>
</body>
</html>
